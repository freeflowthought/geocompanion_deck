<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F3EE" />
    <title>Florus.ai Investor Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              /* Structure */
              ink: '#16161A',
              graphite: '#3F3F45',
              mist: '#76747C',
              paper: '#F6F3EE',
              hull: '#FFFFFF',
              line: '#E4DFD6',

              /* The single accent */
              clay: '#D9542B',
              'clay-deep': '#A63A17',
              'clay-tint': '#FBEDE6',
            },
            boxShadow: {
              lift: '0 24px 48px -32px rgba(22, 22, 26, 0.45)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #F6F3EE;
      }

      body {
        font-family: 'Inter', sans-serif;
        color: #16161A;
        overflow-x: hidden;
      }

      .grain-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.035;
        z-index: 9999;
        background-image: var(--noise);
      }
    </style>
  </head>
  <body>
    <div class="grain-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
